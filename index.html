<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程規劃地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f4ef;--ink:#1f2328;--muted:#6b6f76;--faint:#a3a6ab;--line:#e3dfd6;--panel:#fffdf9;--hover:#f3f0e8;--accent:#2f6fae;--warn:#c0392b;--alt:#a9abb0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU","MingLiU",serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
.leaflet-container{font-family:inherit}
#app{display:flex;height:100vh;height:100dvh;width:100%}
#grab{display:none}
#side{width:390px;min-width:320px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#head{padding:14px 16px 4px;position:relative}
#ttl{font-size:18px;font-weight:650;letter-spacing:.3px;display:block;margin-right:28px}
#sub{font-size:12.5px;color:var(--muted);line-height:1.5;display:block;margin-top:3px}
.pen{border:none;background:none;cursor:pointer;color:#b3afa6;padding:2px 5px;border-radius:6px;line-height:0;flex:none}
.pen:hover{background:#ebe7de;color:var(--ink)}
.pen svg{width:14px;height:14px}
#head .pen{position:absolute;right:12px;top:14px;opacity:0}
#head:hover .pen,#head.editing .pen{opacity:1}
.ed{outline:none;border-radius:4px;cursor:text;min-width:1em}
.ed[contenteditable=true]{background:#fff;box-shadow:0 0 0 1px #d8d3c7}
.ed[contenteditable=true]:focus{box-shadow:0 0 0 1.5px var(--accent)}
.ed[contenteditable=true]:empty::before{content:attr(data-ph);color:#c2c0ba}
#tabs{display:flex;gap:6px;align-items:center;padding:8px 16px 4px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sp{flex:1}
#opts{display:flex;gap:12px;padding:2px 16px 8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
#opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
#list{overflow:auto;flex:1;padding:0 8px 24px}
.day{border:1px solid transparent;border-radius:10px;padding:6px 8px;margin:2px 0}
.day.sel{background:#fff;border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.day.dropt{border-color:var(--accent);background:#eef4fb}
.day.dragging{opacity:.35}
.dh{display:flex;align-items:center;gap:7px;cursor:pointer;border-radius:7px;padding:2px 0}
.dh:hover{background:var(--hover)}
.day.sel .dh:hover,.day.editing .dh:hover{background:transparent}
.dh .pen{opacity:0}.dh:hover .pen,.day.sel .dh .pen,.day.editing .dh .pen{opacity:1}
.dgrip,.grip{width:12px;flex:none;color:#c9c5bb;cursor:grab;font-size:11px;line-height:19px;text-align:center;opacity:0;user-select:none}
.dh:hover .dgrip,.it:hover .grip{opacity:1}
.dot{width:13px;height:13px;border-radius:50%;flex:none;border:none;padding:0}
.day.editing .dot{cursor:pointer;box-shadow:0 0 0 2px #fff,0 0 0 3px #d8d3c7}
.dd{font-weight:650;font-size:14px;white-space:nowrap}
.dd.pick{position:relative;cursor:pointer;background:#fff;box-shadow:0 0 0 1px #d8d3c7;border-radius:4px;padding:0 4px}
.dd.pick:hover{box-shadow:0 0 0 1.5px var(--accent)}
.dd.pick input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;border:none;padding:0;margin:0}
.dc{font-size:13.5px}
.dmeta{font-size:11.5px;color:var(--faint);white-space:nowrap;margin-left:auto}
.dt{font-size:12px;color:var(--muted);margin:2px 0 0 39px;line-height:1.45;display:block}
.dt:empty{display:none}
.day.editing .dt:empty{display:block}
.items{margin:6px 0 2px}
.it{display:flex;gap:6px;align-items:flex-start;padding:3px 3px 3px 0;border-radius:7px;position:relative;font-size:13px;line-height:1.4;cursor:pointer}
.it:hover{background:var(--hover)}
.it.focus{background:#eaf1f9}
.it.editing{background:#fbfaf7;cursor:default}
.ic.pick{cursor:pointer;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c9c4b8}
.badge.pick{cursor:pointer;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c9c4b8}
.catpick{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.pop .catpick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;font-size:11.5px;text-align:center}
.pop .catpick button.on{background:#eef4fb}
.it.dragging{opacity:.35}
.it.drop-before::before,.it.drop-after::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--accent);border-radius:2px}
.it.drop-before::before{top:-1px}.it.drop-after::after{bottom:-1px}
.tm{width:40px;flex:none;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);line-height:20px;text-align:right}
.it.editing .tm:empty::before{content:"--:--";color:#c2c0ba}
.tm.warn{color:var(--warn);font-weight:600}
.tsel{flex:none;display:flex;align-items:center;gap:1px;font-variant-numeric:tabular-nums;line-height:20px}
.tsel select{appearance:none;-webkit-appearance:none;border:1px solid #d8d3c7;border-radius:5px;background:#fff;height:20px;padding:0 4px;font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer;outline:none;text-align:center}
.tsel select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tsel select:disabled{color:#c2c0ba;cursor:default}
.tsel span{color:var(--muted);font-size:12px}
.tsel.warn select{color:var(--warn);font-weight:600}
.ic{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ic svg{width:12px;height:12px}
.ic.alt{background:#fff!important;border:1.5px dashed var(--alt)}
.ic.plain{background:transparent!important}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-weight:550;word-break:break-word}
.nt{display:block;color:var(--muted);font-size:12px;word-break:break-word;white-space:pre-wrap}
.nt:empty{display:none}
.it.editing .nt:empty{display:block}
.meta2{font-size:11.5px;color:var(--faint)}
.it.small{font-size:12.5px}
.it.small .nm{font-weight:400;color:#5d6168}
.it.alt .nm{color:var(--alt);font-weight:500}
.tag{font-size:10.5px;margin-left:6px;color:#fff;background:var(--alt);border-radius:999px;padding:0 6px;font-weight:500;vertical-align:1px;white-space:nowrap}
.it .pen{opacity:0;margin-top:1px}
.it:hover .pen,.it.editing .pen{opacity:1}
.busy{font-size:11.5px;color:var(--accent)}
.gm{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px}
.gm a{color:var(--accent);text-decoration:none;white-space:nowrap;font-weight:400}
.gm a:hover{text-decoration:underline}
.gm input{flex:1;min-width:0;border:1px dashed #d4d0c6;border-radius:6px;padding:3px 7px;font-size:12px;background:#fff;outline:none}
.gm input:focus{border-style:solid;border-color:var(--accent)}
.add{display:flex;gap:6px;align-items:center;margin:6px 0 2px 18px}
.add input{flex:1;border:1px dashed #d4d0c6;border-radius:7px;padding:5px 9px;font-size:12.5px;background:transparent;outline:none}
.add input:focus{border-style:solid;border-color:var(--accent);background:#fff}
.addday{display:block;margin:8px 8px;width:calc(100% - 16px);border:1px dashed #d4d0c6;background:none;border-radius:9px;padding:7px;color:var(--muted);cursor:pointer;font-size:12.5px}
.addday:hover{background:var(--hover)}
#list{position:relative}
.chips{display:flex;gap:6px;padding:4px 6px 8px;align-items:center;position:sticky;top:0;z-index:5;background:var(--panel);flex-wrap:wrap}
.cats{display:flex;gap:3px;margin-left:auto}
.cats button{border:none;padding:0;cursor:pointer;background:#4a4f57}
.cats button:hover{background:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c9c4b8}
.cats button:disabled{opacity:.2;cursor:default;box-shadow:none}
.grp{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:#4a4f57;padding:10px 6px 4px}
.grp .c{font-weight:400;color:var(--faint)}
.ev{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;margin:6px 4px;cursor:pointer;position:relative}
.ev:hover{background:#f7f5ef}
.ev.focus{border-color:var(--accent)}
.ev.editing{cursor:default;background:#fff}
.ev .pen{position:absolute;right:6px;top:7px;opacity:0}
.ev:hover .pen,.ev.editing .pen{opacity:1}
.ev .en{font-weight:600;font-size:13.5px;line-height:1.4;margin-right:22px;display:block}
.ev .grip{opacity:0;display:inline-block;margin-left:-6px;margin-right:2px}.ev:hover .grip{opacity:1}
.ev .em{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ev .eh{font-size:12.5px;margin-top:4px;line-height:1.45;display:block}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;color:#fff;margin-right:6px;vertical-align:1px}
.qnote{font-size:12px;color:var(--muted);line-height:1.5;padding:8px 8px 4px}
#foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:6px;font-size:12px;background:var(--panel)}#foot .sp{display:none}
#status{color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;flex:1}
#status i{width:8px;height:8px;border-radius:50%;background:#2e7d4f;flex:none}
#status.dirty i{background:#d99a1c}#status.saving i{background:var(--accent)}#status.err i{background:var(--warn)}
#status span{line-height:1.35}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12px;white-space:nowrap;flex:none}
.fbtn:hover{background:var(--hover)}
.fbtn:disabled{opacity:.4;cursor:default}
.pop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:5px;z-index:3000;min-width:160px;font-size:13px}
.pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:7px;cursor:pointer}
.pop button:hover{background:var(--hover)}
.pop button.danger{color:var(--warn)}
.pop hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;display:none;z-index:3100;box-shadow:0 6px 20px rgba(0,0,0,.2);align-items:center;gap:12px}
#toast button{background:none;border:none;color:#9cc4ef;cursor:pointer;font-weight:600;padding:0}
#mapwrap{flex:1;position:relative;overflow:hidden}
#map{position:absolute;inset:0;background:#e9edf0}
#map.placing,#map.placing .leaflet-interactive{cursor:crosshair}
.mk{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mk svg{width:12px;height:12px}
.mk.big{width:28px;height:28px}.mk.big svg{width:15px;height:15px}
.mk.alt{background:#fff!important;border:1.5px dashed #8d9096;box-shadow:none}
.mk.dim{opacity:.28}
.mk.focus{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--accent)}
.leaflet-tooltip.lb{background:none;border:none;box-shadow:none;padding:0 0 0 2px;font-size:12.5px;font-weight:600;color:#1f2328;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.leaflet-tooltip.lb::before{display:none}
.leaflet-tooltip.lb.alt{color:#7d8086;font-weight:500}
.leaflet-tooltip.lb.city{font-size:12.5px;font-weight:700}
.leaflet-tooltip.tipx{font-size:12.5px;font-weight:600;white-space:nowrap;max-width:none;padding:4px 9px}
#card{position:absolute;right:14px;top:14px;width:340px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none;z-index:1100}
.ph{position:relative;height:210px;background:#eef1f3;margin:10px 10px 0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8a8f96;font-size:12.5px;text-align:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(40,44,40,.45);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ph .nav.l{left:10px}.ph .nav.r{right:10px}
.ph .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center}
.ph .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.ph .dots i.on{background:#fff}
.ph .cred{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 0 3px #000;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}
#card .cx{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(40,44,40,.45);color:#fff;font-size:17px;cursor:pointer;z-index:2}
#card .cx.solid{background:#f2f0ea;color:var(--ink)}
.cb{padding:12px 16px 16px}
.ct{font-size:18px;font-weight:700;line-height:1.35;text-align:center}
.csub{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px}.csub .ic{width:17px;height:17px}.csub .ic svg{width:10px;height:10px}
.cd{font-size:13.5px;line-height:1.65;margin-top:10px;white-space:pre-wrap}
.cn{font-size:12.5px;line-height:1.55;margin-top:6px;color:#4a4f57;white-space:pre-wrap}
.grate{font-size:12.5px;margin-top:8px;text-align:center;color:#4a4f57}
.grev{font-size:12px;color:#4a4f57;background:#f7f6f2;border-radius:8px;padding:7px 9px;margin-top:6px;line-height:1.5}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:11px;background:#1a73e8;color:#fff!important;text-decoration:none;font-size:13.5px;font-weight:600}
.gbtn:hover{background:#1765cc}
.lab{font-size:11px;color:var(--faint);margin-top:12px;display:block}
.qin{width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;margin-top:3px}
.links{display:flex;gap:16px;margin-top:12px;font-size:12.5px;flex-wrap:wrap}
.links a{color:var(--accent);text-decoration:none}
.links a:hover{text-decoration:underline}
.links .fix{margin-left:auto;border:none;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px}
.links .fix:hover{text-decoration:underline}
#card .gm{margin-top:10px}
#placebar{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#1f2328;color:#fff;font-size:13px;padding:8px 12px;border-radius:9px;display:none;z-index:1200;gap:10px;align-items:center}
#placebar button{background:#fff;color:#1f2328;border:none;border-radius:6px;padding:2px 8px;cursor:pointer}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px;z-index:4000}
@media (hover:none){.dgrip,.grip,.dh .pen,.it .pen,.ev .pen,.ev .grip,#head .pen{opacity:1}}
@media (max-width:760px){#app{flex-direction:column-reverse}#side{width:100%;min-width:0;height:var(--sideh,52%);flex:none;border-right:none;border-top:1px solid var(--line)}#mapwrap{flex:1 1 auto;min-height:0}
#grab{display:block;flex:none;height:20px;margin-bottom:-8px;cursor:ns-resize;touch-action:none;position:relative}#grab::before{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;border-radius:2px;background:#d4d0c6;transform:translateX(-50%)}#side.resizing #grab::before{background:var(--accent)}#head{touch-action:none}#side.resizing{user-select:none}#card{left:10px;right:10px;width:auto;top:10px;max-height:calc(100% - 20px)}.ph{height:160px}}
</style></head><body>

<div id="app">
 <aside id="side">
  <div id="grab"></div>

  <div id="list"></div>

 </aside>

  <div id="card"></div>

 </div>
</div>

};

function icon(k,fg,bg){const c=CATS[k]||CATS.culture;return `<svg viewBox="0 0 24 24" fill="${fg}" style="--bgc:${bg}">${c.svg}</svg>`;}
/* ---------- state ---------- */
let S=null, snap='', undoStack=[], redoStack=[];
const UI={tab:'days',sel:null,focus:null,card:null,showAlt:true,showDetail:true,placing:null,busy:{},editItem:null,editDay:null,editEvent:null,editHead:false,placesFilter:'all',unfound:{},cardFix:null};
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tmin=t=>{if(!t)return null;const m=/^(\d{1,2}):(\d{2})$/.exec(t);return m?(+m[1])*60+(+m[2]):null;};
function normT(v){v=(v||'').trim().replace(/[：.．]/g,':').replace(/\s/g,'');if(!v)return '';
  const m=/^(\d{1,2})(?::?(\d{2}))?$/.exec(v); if(!m)return null; const h=+m[1],mi=+(m[2]||0); if(h>29||mi>59)return null;
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');}
function dateLabel(iso){const d=new Date(iso+'T12:00:00');return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;}
function shiftISO(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
const hasPos=it=>typeof it.lat==='number'&&typeof it.lon==='number';
const gmaps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const gsearch=q=>'https://www.google.com/search?q='+encodeURIComponent(q);
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}

/* ---------- lookup ---------- */
function lists(){const L=S.days.map((d,di)=>({list:d.items,di,day:d}));L.push({list:S.pool,di:-1,day:null});return L;}
function findItem(id){for(const L of lists()){const i=L.list.findIndex(x=>x.id===id);if(i>=0)return {...L,idx:i,it:L.list[i]};}return null;}
const findEvent=id=>S.events.find(e=>e.id===id);
/* stations and hotels take the color of the area they sit in (a departure station on a travel day keeps its own city's color); lines still use the day's color */
function coreOf(d){ return d.items.filter(x=>hasPos(x)&&!x.alt&&!DETAIL.has(x.k)); }
function itemColor(it,di){ if(di<0) return '#8d9096'; const d=S.days[di]; if(!DETAIL.has(it.k)||!hasPos(it)) return d.color;
  const dist=p=>Math.hypot(p.lat-it.lat,p.lon-it.lon); if(coreOf(d).some(p=>dist(p)<0.15)) return d.color;
  let best=null,bd=Infinity; S.days.forEach(x=>coreOf(x).forEach(p=>{const v=dist(p); if(v<bd){bd=v;best=x;}}));
  return best&&bd<0.15?best.color:d.color; }
const dayColor=di=>di<0?'#8d9096':S.days[di].color;
const cityOf=f=>f.day?f.day.city:(f.it.city||'');

/* ---------- history & saving ---------- */
let PDOWN=false, pend=null, saveTimer=null, fileTimer=null;
const isEditingText=()=>{const a=document.activeElement;return !!(a&&a.isContentEditable);};
function commit(opts={}){
  const now=JSON.stringify({...S,updatedAt:0});
  if(now===snap){ if(opts.render!==false) requestRender('full'); return; }
  undoStack.push(snap); if(undoStack.length>150) undoStack.shift(); redoStack=[]; snap=now;
  S.updatedAt=Date.now(); persist(); renderMap(); updateFoot(); requestRender(opts.render===false?'part':'full');
}
function restore(str){ S=JSON.parse(str); S.updatedAt=Date.now(); validateUI(); persist(); renderAll(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snap); snap=undoStack.pop(); restore(snap); toast('已復原'); }
function redo(){ if(!redoStack.length) return; undoStack.push(snap); snap=redoStack.pop(); restore(snap); toast('已重做'); }
function validateUI(){ if(UI.sel!==null&&UI.sel>=S.days.length) UI.sel=null;
  if(UI.card&&UI.card.type==='item'&&!findItem(UI.card.id)) UI.card=null;
  if(UI.card&&UI.card.type==='event'&&!findEvent(UI.card.id)) UI.card=null;
  if(UI.focus&&!findItem(UI.focus)) UI.focus=null; if(UI.editItem&&!findItem(UI.editItem)) UI.editItem=null; }
function requestRender(kind){ pend=(pend==='full'||kind==='full')?'full':'part'; if(PDOWN||isEditingText()) return; flush(); }
function flush(){ if(!pend) return; const p=pend; pend=null; if(p==='full') renderAll(); else {renderCard(); updateFoot();} }
document.addEventListener('pointerdown',()=>{PDOWN=true;},true);
['pointerup','pointercancel','dragend'].forEach(t=>document.addEventListener(t,()=>{PDOWN=false; setTimeout(()=>{if(!PDOWN&&!isEditingText()) flush();},0);},true));
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(!lsSet('trip:'+S.id,S)) toast('瀏覽器暫存空間不足，請記得按儲存'); },300);
  fileDirty=true;
  if(FH){ setStatus('dirty','儲存中…'); clearTimeout(fileTimer); fileTimer=setTimeout(()=>saveToFile(false),1200); }
  else setStatus('dirty','有修改，尚未存檔');
}
function setStatus(st,msg){ const s=$('#status'); s.className=st; s.querySelector('span').textContent=msg||'已暫存在瀏覽器'; }
/* the HTML file itself is the save file: first save asks where it is, later saves write back silently */
const CAN_FS='showSaveFilePicker' in window;
let FH=null, fileDirty=false;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('trip-planner',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); db.transaction('kv','readwrite').objectStore('kv').put(v,k); }catch(e){} }
function buildHTML(){ const json=JSON.stringify(S).replace(/</g,'\\u003c'); return TEMPLATE.replace(/(<script id="trip-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b); }
async function saveToFile(interactive){
  if(!CAN_FS){ if(interactive){ saveFile(safeName()+'.html',buildHTML()); fileDirty=false; setStatus('saved','已下載新的 HTML 檔'); } return; }
  try{

/* Photos come from free sources that need no key, tried in order until there are at least 3:

const COMMONS='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=900';
async function jget(u){ try{ const r=await fetch(u); return r.ok?await r.json():null; }catch(e){ return null; } }
async function wikiMedia(title,out){ const j=await jget('https://en.wikipedia.org/api/rest_v1/page/media-list/'+encodeURIComponent(title)); if(!j) return;

/* ---------- geocoding ---------- */
async function geocode(id,auto){
  const f=findItem(id); if(!f) return; const it=f.it;
  /* search only inside the area the trip already covers that day (or that city's candidates), so a name like "master cannon" can't jump to another country */
  const city=cityOf(f);
  let near=f.day?f.day.items.filter(x=>hasPos(x)&&x.id!==id):S.pool.filter(x=>hasPos(x)&&x.id!==id&&city&&x.city===city);
  if(!near.length&&city) S.days.forEach(d=>{ if(d.city===city) near=near.concat(d.items.filter(hasPos)); });
  UI.busy[id]='找位置中…'; renderList();
  try{
    let lat,lon,wiki=null,q=null;
    if(lat===undefined){
      let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&extratags=1&accept-language=zh-TW,en&q='+encodeURIComponent(it.n+(cityOf(f)?' '+cityOf(f):''));
      if(near.length){ const la=near.map(x=>x.lat), lo=near.map(x=>x.lon); url+=`&bounded=1&viewbox=${Math.min(...lo)-.3},${Math.max(...la)+.3},${Math.max(...lo)+.3},${Math.min(...la)-.3}`; }
      let r=await fetch(url); let j=r.ok?await r.json():[];
      if(!j.length&&cityOf(f)){ r=await fetch(url.replace(encodeURIComponent(it.n+' '+cityOf(f)),encodeURIComponent(it.n))); j=r.ok?await r.json():[]; }
      if(j.length){ lat=+j[0].lat; lon=+j[0].lon; const w=j[0].extratags&&j[0].extratags.wikipedia; if(w&&/^en:/.test(w)) wiki=w.slice(3).replace(/ /g,'_'); q=j[0].name?(j[0].name+(cityOf(f)?' '+cityOf(f):'')):null; }
    }
    delete UI.busy[id]; const g=findItem(id); if(!g){renderList();return;}
    if(lat===undefined){ UI.unfound[id]=true; renderAll(); return; }
    g.it.lat=+lat.toFixed(5); g.it.lon=+lon.toFixed(5); if(wiki&&!g.it.wiki) g.it.wiki=wiki; if(q&&!g.it.q) g.it.q=q;
    UI.focus=id; commit(); flyTo(g.it);
    toast(`已定位「${g.it.n}」，不對的話可以修正`,'修正',()=>{ UI.cardFix=id; openItem(id,false); later(()=>{const n=$('#card .gm input'); if(n) n.focus();}); });
  }catch(e){ delete UI.busy[id]; UI.unfound[id]=true; renderList(); }
}

  const labels=L.tileLayer(esri('World_Light_Gray_Reference'),{maxNativeZoom:16,maxZoom:20,pane:'overlayPane'}).addTo(map);
  let fails=0, switched=false;
  base.on('tileerror',()=>{ if(switched||++fails<6) return; switched=true; map.removeLayer(base); map.removeLayer(labels);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map); });
  routeLayer=L.layerGroup().addTo(map); layer=L.layerGroup().addTo(map);
  map.on('click',e=>{ if(UI.placing) return placeAt(e.latlng); if(UI.card){UI.card=null;renderCard();renderList();} });
  map.on('zoomend moveend',()=>declutter());
  map.on('zoomend',()=>{ const big=map.getZoom()>=12; if(big!==initMap._big){initMap._big=big;renderMap();} });
}
function markHTML(it,color,big,alt,dim,focus){
  const cls='mk'+(big?' big':'')+(alt?' alt':'')+(dim?' dim':'')+(focus?' focus':'');
  return `<div class="${cls}" style="background:${color}">${icon(it.k,alt?'#8d9096':'#fff',alt?'#fff':color)}</div>`;
}
function renderMap(){
  if(!S||!map) return;
  layer.clearLayers(); routeLayer.clearLayers(); labelTips=[];
  const sel=UI.sel, tab=UI.tab, z=map.getZoom();
  const showAlt=UI.showAlt||(tab==='places'&&UI.placesFilter==='pool');
  const dimAll=tab==='events';
  S.days.forEach((d,di)=>{ const pts=d.items.filter(it=>hasPos(it)&&!it.alt);
    for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; if(a.lat===b.lat&&a.lon===b.lon) continue; const far=Math.hypot(a.lat-b.lat,a.lon-b.lon)>0.25;
      const on=sel===null||sel===di; L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:d.color,weight:on&&sel!==null?3.5:2.5,opacity:dimAll?.25:(on?.9:.15),dashArray:far?'7 7':null,interactive:false}).addTo(routeLayer); } });
  /* lines are drawn only inside a day, so a day that ends far from where the next one starts (night train, day trip back)
     gets a dotted link in the leaving day's color; nearby ends (back to the same hotel) stay unlinked */
  for(let di=0;di<S.days.length-1;di++){ const a=[...S.days[di].items].reverse().find(it=>hasPos(it)&&!it.alt), b=S.days[di+1].items.find(it=>hasPos(it)&&!it.alt);
    if(!a||!b||Math.hypot(a.lat-b.lat,a.lon-b.lon)<0.15) continue; const on=sel===null||sel===di||sel===di+1;
    L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:S.days[di].color,weight:2.5,opacity:dimAll?.25:(on?.8:.15),dashArray:'2 7',interactive:false}).addTo(routeLayer); }
  const marks=[];
  S.days.forEach((d,di)=>d.items.forEach(it=>{ if(hasPos(it)&&(!it.alt||showAlt||UI.focus===it.id)) marks.push({it,di,color:itemColor(it,di),alt:!!it.alt,day:d}); }));
  if(showAlt||tab==='places') S.pool.forEach(it=>{ if(hasPos(it)) marks.push({it,di:-1,color:'#8d9096',alt:true,pool:true}); });
  const isOn=m=>tab==='places'?(UI.placesFilter==='pool'?m.pool:true):(sel===null||m.di===sel);
  marks.sort((a,b)=>(isOn(a)?1:0)-(isOn(b)?1:0)||(a.alt?0:1)-(b.alt?0:1));
  marks.forEach(m=>{
    const on=isOn(m), big=on&&sel!==null&&tab==='days'&&!m.alt, focus=UI.focus===m.it.id;
    const sz=big?28:22;
    const mk=L.marker([m.it.lat,m.it.lon],{icon:L.divIcon({className:'',html:markHTML(m.it,m.color,big,m.alt,dimAll||!on,focus),iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),zIndexOffset:focus?2000:(on?1000:0)+(m.alt?0:100),riseOnHover:true});
    const head=esc(m.it.n);
    mk.on('click',e=>{ L.DomEvent.stop(e); if(UI.placing) return placeAt(e.latlng); if(m.di>=0&&UI.tab==='events') UI.tab='days'; openItem(m.it.id,false); });
    mk.addTo(layer);
    if(on&&!dimAll&&((sel!==null&&m.di===sel)||(tab==='places'&&z>=12)||(sel===null&&tab==='days'&&z>=13))){
      mk.bindTooltip(esc((m.it.t&&!m.alt&&sel!==null?m.it.t+' ':'')+m.it.n),{permanent:true,direction:'right',offset:[sz/2,0],className:'lb'+(m.alt?' alt':'')}); labelTips.push(mk);
    } else mk.bindTooltip(head,{direction:'top',offset:[0,-sz/2],className:'tipx'});
  });
  if(sel===null&&tab==='days'&&z<13){ const seen={}; S.days.forEach(d=>{ const s=d.items.find(x=>hasPos(x)&&!x.alt&&x.k!=='transit')||d.items.find(hasPos); if(!s) return;
      const lab=dateLabel(d.date).split('（')[0]; if(seen[d.city]){seen[d.city].t+='、'+lab;return;} seen[d.city]={s,t:d.city+' '+lab,c:d.color}; });
    Object.values(seen).forEach(v=>{ const mk=L.marker([v.s.lat,v.s.lon],{icon:L.divIcon({className:'',html:'',iconSize:[0,0]}),interactive:false}).addTo(layer);
      mk.bindTooltip(esc(v.t),{permanent:true,direction:'right',offset:[10,0],className:'lb city'}); mk.getTooltip().options.color=v.c; labelTips.push(mk);
      setTimeout(()=>{const t=mk.getTooltip(); if(t&&t._container) t._container.style.color=v.c;},0); }); }
  const evs=tab==='events'?S.events.filter(e=>typeof e.lat==='number'):[];
  evs.forEach(e=>{ const html=`<div class="mk" style="background:${FIT[e.fit]||'#999'};border-radius:5px;transform:rotate(45deg)"><span style="transform:rotate(-45deg);color:#fff;font-size:11px">★</span></div>`;
    const mk=L.marker([e.lat,e.lon],{icon:L.divIcon({className:'',html,iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:3000}).addTo(layer);
    mk.on('click',ev=>{L.DomEvent.stop(ev); UI.card={type:'event',id:e.id}; renderAll();});
    mk.bindTooltip(esc(e.n.split('（')[0]),{permanent:true,direction:'right',offset:[11,0],className:'lb'}); labelTips.push(mk); });
  later(declutter);
}
function declutter(){
  const boxes=[];
  labelTips.forEach(mk=>{ const t=mk.getTooltip(); if(!t||!t._container) return; const c=t._container; c.style.visibility='visible';
    const r=c.getBoundingClientRect(); if(!r.width) return; const hit=boxes.some(b=>!(r.right<b.left||b.right<r.left||r.bottom<b.top||b.bottom<r.top));
    if(hit) c.style.visibility='hidden'; else boxes.push(r); });
}
function bounds(pts){ return L.latLngBounds(pts.map(p=>[p.lat,p.lon])); }
function fitAll(){ const p=[]; S.days.forEach(d=>d.items.forEach(it=>{if(hasPos(it)&&!it.alt)p.push(it);})); if(p.length) map.flyToBounds(bounds(p),{padding:[40,40],duration:.7}); }
function fitDay(di){ const d=S.days[di]; let core=d.items.filter(s=>hasPos(s)&&!s.alt&&s.k!=='transit'&&s.k!=='stay'); if(core.length<2) core=d.items.filter(s=>hasPos(s)&&!s.alt); if(!core.length) core=d.items.filter(hasPos); if(!core.length) return;
  if(core.length===1) return flyTo(core[0]); map.flyToBounds(bounds(core),{padding:[70,70],maxZoom:16,duration:.7}); }
function flyTo(o,minZ){ map.flyTo([o.lat,o.lon],Math.max(map.getZoom(),minZ||15),{duration:.6}); }
function startPlacing(id){ UI.placing={id}; $('#map').classList.add('placing'); $('#placebar').style.display='flex'; $('#placetxt').textContent=`在地圖上點一下「${findItem(id).it.n}」的位置`; }
function stopPlacing(){ UI.placing=null; $('#map').classList.remove('placing'); $('#placebar').style.display='none'; }
$('#placecancel').onclick=stopPlacing;
function placeAt(ll){ const {id}=UI.placing; stopPlacing(); const f=findItem(id); if(!f) return; f.it.lat=+ll.lat.toFixed(5); f.it.lon=+ll.lng.toFixed(5); UI.focus=id; commit(); toast(`已設定「${f.it.n}」的位置`,'復原',undo); }

/* ---------- exports ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
function saveFile(filename,data){ const b=data instanceof Blob?data:new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }
const safeName=()=>(S.title||'trip').replace(/\//g,'-').replace(/[\\:*?"<>|]/g,'').trim().slice(0,60)||'trip';
function allItems(){ const out=[]; S.days.forEach(d=>d.items.forEach(it=>out.push({d,it}))); S.pool.forEach(it=>out.push({d:null,it})); return out; }
function exportCSV(){
  const rows=[['名稱','日期','時間','城市','類別','狀態','說明','緯度','經度','Google 地圖']];
  allItems().forEach(({d,it})=>{ if(!hasPos(it)) return; rows.push([it.n,d?dateLabel(d.date):'',it.t||'',d?d.city:(it.city||''),(CATS[it.k]||{}).name||'',!d?'候選地點':it.alt?'備案':'行程',[it.note,it.desc].filter(Boolean).join('。'),it.lat,it.lon,gmaps(it.q||it.n)]); });
  saveFile(safeName()+'_Google我的地圖.csv','﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n'));
  toast('已匯出。到 mymaps.google.com 建立地圖後按「匯入」');
}
function exportJSON(){ saveFile(safeName()+'.json',JSON.stringify(S,null,1)); }
function exportHTML(){ saveFile(safeName()+'.html',buildHTML()); toast('已下載含目前行程的 HTML'); }
async function exportXLSX(){
  toast('準備 Excel 中…');
  try{ if(!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js'); }catch(e){ toast('Excel 套件載入失敗'); return; }
  const X=window.XLSX, days=S.days, slots=[]; for(let m=360;m<1440;m+=30) slots.push(m);
  const fmt=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  const aoa=[['城市','','',...days.map((d,i)=>i===0||days[i-1].city!==d.city?d.city:'')],[],['時間','','',...days.map(d=>{const x=new Date(d.date+'T12:00:00');return `${x.getMonth()+1}/${x.getDate()}`;})],['','','',...days.map(d=>WD[new Date(d.date+'T12:00:00').getDay()])]];
  const grid=slots.map(()=>days.map(()=>[]));
  days.forEach((d,di)=>{ let last=0; d.items.forEach(it=>{ if(it.alt) return; const m=tmin(it.t); let si=m===null?last:Math.max(0,Math.min(slots.length-1,Math.floor((m-360)/30))); last=si; grid[si][di].push(it.n+(it.note?'\n'+it.note:'')); }); });
  slots.forEach((m,si)=>aoa.push([fmt(m),'-',fmt(m+30),...grid[si].map(a=>a.join('\n'))]));
  const ws=X.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:7},{wch:2},{wch:7},...days.map(()=>({wch:22}))];
  const rg=X.utils.decode_range(ws['!ref']);
  for(let r=0;r<=rg.e.r;r++) for(let c=0;c<=rg.e.c;c++){ const ref=X.utils.encode_cell({r,c}); if(!ws[ref]) ws[ref]={t:'s',v:''};
    ws[ref].s={alignment:{wrapText:true,vertical:'top',horizontal:c<3?'center':'left'},font:{name:'Arial',sz:10,bold:r<4}};
    if(r===0&&c>=3&&ws[ref].v) ws[ref].s.font={bold:true,color:{rgb:days[c-3].color.replace('#','').toUpperCase()}}; }
  const rows=[['日期','星期','城市','時間','項目','備註','類別','狀態','緯度','經度','Google 地圖']];
  allItems().forEach(({d,it})=>rows.push([d?dateLabel(d.date).split('（')[0]:'',d?WD[new Date(d.date+'T12:00:00').getDay()]:'',d?d.city:(it.city||''),it.t||'',it.n,it.note||'',(CATS[it.k]||{}).name||'',!d?'候選地點':it.alt?'備案':'行程',hasPos(it)?it.lat:'',hasPos(it)?it.lon:'',hasPos(it)?gmaps(it.q||it.n):'']));
  const ws2=X.utils.aoa_to_sheet(rows); ws2['!cols']=[{wch:7},{wch:4},{wch:10},{wch:6},{wch:30},{wch:36},{wch:7},{wch:6},{wch:9},{wch:9},{wch:40}];
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'日程'); X.utils.book_append_sheet(wb,ws2,'清單');
  saveFile(safeName()+'.xlsx',new Blob([X.write(wb,{bookType:'xlsx',type:'array'})])); toast('Excel 已匯出');
}
function importJSON(){ const f=el('input'); f.type='file'; f.accept='.json,application/json'; f.onchange=async()=>{ const file=f.files[0]; if(!file) return;
  try{ const j=JSON.parse(await file.text()); if(!j||!Array.isArray(j.days)) throw 0; const id=S.id; S=normalize(j); S.id=id; UI.sel=null; UI.card=null; commit(); fitAll(); toast('已匯入','復原',undo); }
  catch(e){ toast('這不是行程檔案'); } }; f.click(); }
function moreMenu(){ popMenu($('#moreBtn'),[
  ['匯出 Excel',exportXLSX],['匯出 Google 我的地圖 CSV',exportCSV],'hr',
  ['補齊所有地點照片',fillAllPhotos],'hr',
  ['另存新的 HTML',exportHTML],['下載備份 JSON',exportJSON],['匯入備份 JSON',importJSON]]); }

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,act,fn){ const t=$('#toast'); $('#toastmsg').textContent=msg; const b=$('#toastact');
  if(act){b.textContent=act;b.style.display='inline';b.onclick=()=>{t.style.display='none';fn();};} else b.style.display='none';
  t.style.display='flex'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',act?6000:3200); }

/* ---------- global controls ---------- */
document.querySelectorAll('#tabs [data-tab]').forEach(b=>{ b.onclick=()=>{ UI.tab=b.dataset.tab; UI.card=null; UI.focus=null; UI.editItem=null; if(UI.tab!=='days') UI.sel=null; renderAll(); $('#list').scrollTop=0;
  if(UI.tab==='events'){ const p=S.events.filter(e=>typeof e.lat==='number'); if(p.length) map.flyToBounds(bounds(p),{padding:[40,40],duration:.7}); } else fitAll(); }; });
$('#allbtn').onclick=()=>{UI.tab='days';UI.sel=null;UI.focus=null;UI.card=null;renderAll();fitAll();};
$('#optAlt').onchange=e=>{UI.showAlt=e.target.checked;renderMap();};
$('#optDetail').onchange=e=>{UI.showDetail=e.target.checked;renderList();};
$('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo; $('#moreBtn').onclick=moreMenu; $('#saveBtn').onclick=()=>saveToFile(true);
document.addEventListener('keydown',e=>{
  const inEdit=e.target.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName); const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='s'){ e.preventDefault(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); later(()=>saveToFile(true)); return; }
  if(inEdit) return;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault(); e.shiftKey?redo():undo(); return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault(); redo(); return;}
  if(e.key==='Escape'){ if(UI.placing) stopPlacing(); else if(UI.editItem||UI.editDay||UI.editEvent||UI.editHead){UI.editItem=UI.editDay=UI.editEvent=null;UI.editHead=false;renderAll();} else if(UI.card){UI.card=null;renderCard();} closePop(); }
});

/* ---------- mobile: drag the top of the list panel to trade space between list and map ---------- */
const MOBILE=matchMedia('(max-width:760px)');
function setSideH(pct){ pct=Math.max(18,Math.min(92,pct)); $('#app').style.setProperty('--sideh',pct.toFixed(1)+'%'); return pct; }
(function initSheet(){
  const side=$('#side'), app=$('#app'); let y0=null, h0=0, pct=null, raf=0, moved=false;
  const saved=lsGet('trip-ui:sideh'); if(typeof saved==='number') setSideH(saved);
  const start=ev=>{ if(!MOBILE.matches) return;
    if(ev.currentTarget.id==='head'&&(UI.editHead||ev.target.closest('.pen'))) return;
    y0=ev.clientY; h0=side.offsetHeight; moved=false; ev.currentTarget.setPointerCapture(ev.pointerId); };
  const move=ev=>{ if(y0===null) return; const dy=ev.clientY-y0; if(!moved&&Math.abs(dy)<4) return;
    if(!moved){ moved=true; side.classList.add('resizing'); }
    pct=setSideH((h0-dy)/app.clientHeight*100);
    if(!raf) raf=requestAnimationFrame(()=>{ raf=0; if(map) map.invalidateSize({pan:false}); }); };
  const end=()=>{ if(y0===null) return; y0=null; side.classList.remove('resizing');
    if(moved&&pct!==null){ lsSet('trip-ui:sideh',pct); if(map) map.invalidateSize({pan:false}); } };
  [$('#grab'),$('#head')].forEach(n=>{ n.addEventListener('pointerdown',start); n.addEventListener('pointermove',move); n.addEventListener('pointerup',end); n.addEventListener('pointercancel',end); });
  MOBILE.addEventListener('change',()=>later(()=>map&&map.invalidateSize()));
})();
/* ---------- boot ---------- */
const MIG={sight:'culture',inst:'academic',food:'restaurant',move:'transit',note:'life'};
function normalize(j){
  j.v=2; j.id=j.id||uid(); j.title=j.title||'未命名行程'; j.sub=j.sub||''; j.pool=j.pool||[]; j.events=j.events||[]; j.updatedAt=j.updatedAt||0;
  const fix=it=>{it.id=it.id||uid(); if(!CATS[it.k]) it.k=MIG[it.k]||'culture'; it.note=it.note||''; it.n=it.n||'（未命名）';};
  j.days.forEach((d,i)=>{d.id=d.id||uid(); d.items=d.items||[]; d.color=d.color||PALETTE[i%PALETTE.length]; d.city=d.city||''; d.title=d.title||''; d.items.forEach(fix);});
  j.pool.forEach(fix); j.events.forEach(e=>{e.id=e.id||uid();});
  return j;
}
async function boot(){
  let embedded;
  try{ embedded=normalize(JSON.parse($('#trip-data').textContent)); }catch(e){ $('#loading').textContent='行程資料讀取失敗'; return; }
  S=embedded; let fromCache=false;
  const local=lsGet('trip:'+embedded.id); if(local&&local.days&&(local.updatedAt||0)>(embedded.updatedAt||0)){ S=normalize(local); fromCache=true; }
  if(typeof L==='undefined'){ $('#loading').textContent='地圖元件載入失敗，請確認網路連線'; return; }
  $('#loading').remove();
  initMap(); snap=JSON.stringify({...S,updatedAt:0});
  renderAll(); map.fitBounds(bounds(S.days.flatMap(d=>d.items.filter(it=>hasPos(it)&&!it.alt))),{padding:[40,40]});
  if(CAN_FS){ const h=await idbGet('fh:'+S.id); if(h&&h.queryPermission) FH=h; }
  if(fromCache){ fileDirty=true; setStatus('dirty','已載入較新的暫存版本'); }
  else setStatus('saved',FH?'自動存到 '+FH.name:'已暫存在瀏覽器');
}
window.addEventListener('beforeunload',e=>{ if(fileDirty&&!FH){ e.preventDefault(); e.returnValue=''; } });
boot();
