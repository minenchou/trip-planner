<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歐洲行 1/30–2/19 路線地圖</title>
<style>
:root{--bg:#f6f4ef;--land:#ffffff;--land2:#efece4;--border:#b9b3a6;--water:#bcd6e6;--ink:#1f2328;--muted:#6b6f76;--line:#e3dfd6;--panel:#fffdf9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100vh;width:100%}
#side{width:340px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:18px 18px 10px}
#side h1{font-size:18px;margin:0 0 4px;letter-spacing:.5px}
#side .sub{font-size:12.5px;color:var(--muted);line-height:1.5}
#tools{display:flex;gap:8px;align-items:center;padding:4px 18px 10px;flex-wrap:wrap}
button.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
button.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label.opt{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer}
#days{overflow:auto;flex:1;padding:0 10px 16px}
.day{border:1px solid transparent;border-radius:10px;padding:9px 10px;margin:3px 0;cursor:pointer}
.day:hover{background:#f3f0e8}
.day.sel{background:#fff;border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.dh{display:flex;align-items:center;gap:9px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dd{font-weight:650;font-size:14px;min-width:62px}
.dc{font-size:13.5px}
.dt{font-size:12px;color:var(--muted);margin:3px 0 0 21px;line-height:1.45}
ol.stops{list-style:none;margin:8px 0 2px 0;padding:0 0 0 21px}
ol.stops li{display:flex;gap:8px;padding:4px 4px;border-radius:6px;font-size:13px;line-height:1.4;cursor:pointer}
ol.stops li:hover{background:#f3f0e8}
.num{flex:none;width:19px;height:19px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.num.i{border-radius:4px}
.num.h{border-radius:3px;background:#fff!important;border:2px solid;color:var(--ink);font-size:10px}
.sn{font-weight:550}.snote{display:block;color:var(--muted);font-size:12px}
.ev{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;margin:6px 0;cursor:pointer}
.ev:hover{background:#f7f5ef}
.ev .en{font-weight:600;font-size:13.5px;line-height:1.4}
.ev .em{font-size:12px;color:var(--muted);margin-top:2px}
.ev .eh{font-size:12.5px;margin-top:4px;line-height:1.45}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;color:#fff;margin-right:6px;vertical-align:1px}
.qnote{font-size:12px;color:var(--muted);line-height:1.5;padding:8px 4px 4px}
#legend{border-top:1px solid var(--line);padding:10px 18px 14px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
#legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg{display:inline-block;width:11px;height:11px;background:#555}
#mapwrap{flex:1;position:relative;overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;background:#e4eef3}
.country{fill:var(--land);stroke:var(--border);stroke-width:.7px;vector-effect:non-scaling-stroke}
.water{fill:var(--water);stroke:var(--water);stroke-width:.6px;vector-effect:non-scaling-stroke}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:12.5px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;fill:#1f2328;pointer-events:none}
.clbl{font-size:12px;fill:#8d877b;letter-spacing:2px;pointer-events:none}
.cityl{font-size:12px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:#1f2328;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;max-width:260px;line-height:1.45;display:none;z-index:5}
#card{position:absolute;right:60px;top:14px;width:320px;max-width:calc(100% - 28px);background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:hidden;display:none;z-index:6}
#card .ph{height:190px;background:#eef1f3;display:flex;align-items:center;justify-content:center;color:#8a8f96;font-size:12.5px;text-align:center;padding:0 18px}
#card .ph img{width:100%;height:100%;object-fit:cover;display:block}
#card .bd{padding:12px 15px 14px}
#card .ct{font-size:15.5px;font-weight:650;line-height:1.35;padding-right:22px}
#card .cm{font-size:12px;color:var(--muted);margin-top:3px}
#card .cd{font-size:13.5px;line-height:1.6;margin-top:8px}
#card .cn{font-size:12.5px;line-height:1.5;margin-top:6px;color:#4a4f57}
#card .cl{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
#card .cl a{color:#2f6fae;text-decoration:none}
#card .cx{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:16px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
@media (max-width:760px){#card{left:10px;right:10px;width:auto;top:auto;bottom:10px}#card .ph{height:150px}}
#zoomctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
#zoomctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
#hint{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}
@media (max-width:760px){#app{flex-direction:column-reverse}#side{width:100%;height:46vh;border-right:none;border-top:1px solid var(--line)}#mapwrap{height:54vh;flex:none}}
</style></head><body>
<div id="app">
 <aside id="side">
  <header><h1>歐洲行路線圖 1/30–2/19</h1>
   <div class="sub">倫敦（牛津、溫莎、巴斯）→ 巴黎 → 阿姆斯特丹 → 慕尼黑 → 薩爾斯堡 → 林茲 → 布拉格。點日期看當天路線，點地點會放大；「活動」分頁是這段期間的會議與展覽。</div></header>
  <div id="tools"><button class="pill on" id="allbtn">全程</button><button class="pill" id="evbtn">活動</button><label class="opt"><input type="checkbox" id="optchk">顯示備選地點</label></div>
  <div id="days"></div>
  <div id="legend">
   <span><i class="lg" style="border-radius:50%"></i>景點</span>
   <span><i class="lg" style="border-radius:2px"></i>順路經過的機構學校</span>
   <span><i class="lg" style="background:#fff;border:2px solid #555;border-radius:2px"></i>車站、交通節點</span>
   <span><i class="lg" style="background:#fff;border:2px dashed #888;border-radius:50%"></i>備選</span>
   <span><svg width="12" height="12"><path d="M6 0.5l1.6 3.6 3.9.3-3 2.6.9 3.8L6 8.8 2.6 10.8l.9-3.8-3-2.6 3.9-.3z" fill="#2e7d4f"/></svg>活動（綠順路／藍可安排／灰不順路）</span>
   <span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#555" stroke-width="2.5" stroke-dasharray="5 4"/></svg>城市間移動</span>
  </div>
 </aside>
 <div id="mapwrap"><svg id="map"></svg><div id="tip"></div>
  <div id="card"><button class="cx" id="cardx" aria-label="關閉">×</button><div class="ph" id="cph"></div><div class="bd"><div class="ct" id="ctt"></div><div class="cm" id="cmt"></div><div class="cd" id="cdd"></div><div class="cn" id="cnn"></div><div class="cl" id="cll"></div></div></div>
  <div id="zoomctl"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button></div>
  <div id="hint">滾輪或雙指縮放，拖曳移動</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA = {"days":[{"d":"1/30","wd":"六","city":"倫敦","color":"#a83246","title":"抵達倫敦、西敏區散步、泰晤士河夜景","stops":[{"n":"Gatwick 機場","note":"09:00 抵達、入境","lat":51.1537,"lon":-0.1821,"k":"h","wiki":"Gatwick_Airport","desc":"倫敦第二大機場，在市區南方約 45 公里，搭 Thameslink 約 40 分鐘到 London Bridge。"},{"n":"London Bridge","note":"Thameslink 進城、放行李","lat":51.5049,"lon":-0.0863,"k":"h","wiki":"London_Bridge_station","desc":"倫敦最古老的火車站之一，旁邊就是碎片大廈和波羅市場。"},{"n":"西敏寺","note":"先進，週六較早關門","lat":51.4994,"lon":-0.1273,"k":"s","wiki":"Westminster_Abbey","desc":"英國國王加冕與王室婚禮的教堂，牛頓、達爾文、霍金都安葬在這裡。"},{"n":"國會大廈、大笨鐘","note":"","lat":51.5007,"lon":-0.1246,"k":"s","wiki":"Palace_of_Westminster","desc":"英國國會所在地，哥德復興式建築，鐘塔的正式名稱是伊莉莎白塔。"},{"n":"聖詹姆士公園","note":"","lat":51.5025,"lon":-0.1348,"k":"s","wiki":"St_James's_Park","desc":"倫敦最古老的皇家公園，湖上有鵜鶘，從橋上可以同時看到白金漢宮和白廳。"},{"n":"白金漢宮","note":"","lat":51.5014,"lon":-0.1419,"k":"s","wiki":"Buckingham_Palace","desc":"英國君主在倫敦的官邸，冬季的衛兵交接不是每天舉行，去之前先查日程。"},{"n":"特拉法加廣場","note":"","lat":51.508,"lon":-0.1281,"k":"s","wiki":"Trafalgar_Square","desc":"紀念特拉法加海戰的廣場，中央是納爾遜紀念柱，北側就是國家美術館。"},{"n":"柯芬園","note":"","lat":51.5117,"lon":-0.124,"k":"s","wiki":"Covent_Garden","desc":"舊蔬果市場改建的購物區，常有街頭表演，旁邊是皇家歌劇院。"},{"n":"倫敦國王學院 Strand 校區","note":"路過：馬克士威曾在此任教","lat":51.5115,"lon":-0.116,"k":"i","wiki":"King's_College_London","desc":"馬克士威在這裡任教時發展出電磁學理論，富蘭克林拍下 DNA 的 X 光繞射照片也是在這裡。"},{"n":"倫敦眼","note":"泰晤士河夜景","lat":51.5033,"lon":-0.1196,"k":"s","wiki":"London_Eye","desc":"泰晤士河南岸的大型摩天輪，轉一圈約 30 分鐘，入夜後河岸燈光很漂亮。"}]},{"d":"1/31","wd":"日","city":"牛津","color":"#1d4e89","title":"牛津大學、科學史博物館、物理系路過","stops":[{"n":"Paddington","note":"","lat":51.5154,"lon":-0.1755,"k":"h","wiki":"London_Paddington_station","desc":"布魯內爾設計的鑄鐵玻璃頂車站，往牛津和巴斯的火車從這裡出發。"},{"n":"Oxford 車站","note":"","lat":51.7535,"lon":-1.27,"k":"h","wiki":"Oxford_railway_station","desc":"牛津的主要車站，走到市中心大約 10 到 15 分鐘。"},{"n":"Covered Market","note":"午餐","lat":51.752,"lon":-1.2577,"k":"s","wiki":"Covered_Market,_Oxford","desc":"1774 年開業的室內市集，有咖啡館、甜點和許多老店。"}     .attr('x',d=>xy(d[1],d[2])[0]).attr('y',d=>xy(d[1],d[2])[1]).attr('text-anchor','middle').text(d=>d[0]);
  // routes: one path per segment so long legs can be dashed
  const segs=[];
  DATA.days.forEach((d,di)=>{for(let i=0;i<d.stops.length-1;i++){const a=d.stops[i],b=d.stops[i+1];
    if(a.lat===b.lat&&a.lon===b.lon)continue; segs.push({di,a,b,long:dist(a,b)>0.25,color:d.color});}});
  gR.selectAll('line').data(segs).join('line').attr('class','route')
    .attr('x1',s=>xy(s.a.lon,s.a.lat)[0]).attr('y1',s=>xy(s.a.lon,s.a.lat)[1])
    .attr('x2',s=>xy(s.b.lon,s.b.lat)[0]).attr('y2',s=>xy(s.b.lon,s.b.lat)[1])
    .attr('stroke',s=>s.color)
    .attr('stroke-width',s=>sel===null?(s.long?2.6:2.2):(s.di===sel?3.2:1.6))
    .attr('stroke-dasharray',s=>s.long?'7 6':null)
    .attr('opacity',s=>tab==='events'?.3:(sel===null?.9:(s.di===sel?1:.13)));
  // markers
  const marks=[];
  DATA.days.forEach((d,di)=>{let n=0;d.stops.forEach(s=>{if(s.k==='x')return; n++; marks.push({...s,di,num:n,color:d.color});});});
  const vis = marks.filter(m=>sel===null||m.di===sel);
  const dim = marks.filter(m=>sel!==null&&m.di!==sel);
  const big = sel!==null;
  const mk = gM.selectAll('g.m').data([...dim,...vis],m=>m.di+'_'+m.num).join(enter=>{
      const g=enter.append('g').attr('class','m').style('cursor','pointer');
      g.append('path'); g.append('text').attr('text-anchor','middle').attr('dy','0.35em')
        .style('font-size','10.5px').style('font-weight','700').style('pointer-events','none');
      return g;});
  mk.attr('transform',m=>`translate(${xy(m.lon,m.lat)})`).attr('opacity',m=>tab==='events'?.3:(sel===null||m.di===sel?1:.18));
  mk.select('path').attr('d',m=>{const r=big&&m.di===sel?10:(m.k==='h'?3.6:4.2);
      if(m.k==='i'){return `M${-r},${-r}h${2*r}v${2*r}h${-2*r}Z`;}
      if(m.k==='h'){const q=r*.9;return `M${-q},${-q}h${2*q}v${2*q}h${-2*q}Z`;}
      return d3.symbol(d3.symbolCircle, Math.PI*r*r)();})
    .attr('fill',m=>m.k==='h'?'#fff':m.color).attr('stroke',m=>m.k==='h'?m.color:'#fff')
    .attr('stroke-width',m=>m.k==='h'?2.2:1.4)
    .attr('rx',2);
  mk.select('text').text(m=>big&&m.di===sel?m.num:'').attr('fill',m=>m.k==='h'?'#1f2328':'#fff');
  mk.on('mousemove',(ev,m)=>tip(ev,`<b>${DATA.days[m.di].d}（${DATA.days[m.di].wd}）${m.num}. ${m.n}</b>${m.note?'<br>'+m.note:''}`))
    .on('mouseleave',()=>tip(null)).on('click',(ev,m)=>{ev.stopPropagation();tip(null);if(sel!==m.di)selectDay(m.di,false);stopCard(m,DATA.days[m.di]);});
  // optional
  const op = gM.selectAll('g.o').data(showOpt?DATA.optional:[]).join(enter=>{const g=enter.append('g').attr('class','o').style('cursor','pointer');
      g.append('circle').attr('r',6).attr('fill','#fff').attr('stroke','#888').attr('stroke-width',2).attr('stroke-dasharray','3 2');return g;});
  op.attr('transform',o=>`translate(${xy(o.lon,o.lat)})`)
    .on('mousemove',(ev,o)=>tip(ev,`<b>${o.n}</b><br>${o.note}`)).on('mouseleave',()=>tip(null))
    .on('click',(ev,o)=>{ev.stopPropagation();tip(null);showCard({n:o.n,meta:'備選地點',desc:o.desc,note:o.note,wiki:o.wiki});});
  // events
  const evs = tab==='events' ? DATA.events.filter(e=>e.lat!==null) : [];
  const eg = gM.selectAll('g.e').data(evs, e=>e.n).join(enter=>{const g=enter.append('g').attr('class','e').style('cursor','pointer');
      g.append('path').attr('d',d3.symbol(d3.symbolStar,150)()).attr('stroke','#fff').attr('stroke-width',1.2);return g;});
  eg.attr('transform',e=>`translate(${xy(e.lon,e.lat)})`).select('path').attr('fill',e=>FIT[e.fit]);
  eg.on('mousemove',(ev,e)=>tip(ev,`<b>${e.n}</b><br>${e.dates}・${e.city}・${e.venue}<br>${e.how}`)).on('mouseleave',()=>tip(null))
    .on('click',(ev,e)=>{ev.stopPropagation();tip(null);eventCard(e);});
  // labels
  let lbls=[];
  if(tab==='events'){ evs.forEach(e=>lbls.push({x:xy(e.lon,e.lat),t:e.n.split('（')[0],c:FIT[e.fit],pri:1,r:9})); placeLabels(lbls); return; }
  if(sel===null){
    // city cluster labels in overview
    const seen={};
    DATA.days.forEach((d,di)=>{const s=d.stops.find(s=>s.k!=='x'&&s.k!=='h')||d.stops[0];
      const key=d.city; if(seen[key]){seen[key].t+='、'+d.d;return;}
      seen[key]={x:xy(s.lon,s.lat),t:d.city+' '+d.d,c:d.color,pri:0}; lbls.push(seen[key]);});
    if(k>=6){lbls=[];marks.forEach(m=>lbls.push({x:xy(m.lon,m.lat),t:m.n,c:'#1f2328',pri:1}));}
  } else {
    vis.forEach(m=>lbls.push({x:xy(m.lon,m.lat),t:m.num+' '+m.n,c:'#1f2328',pri:1,r:12}));
  }
  if(showOpt) DATA.optional.forEach(o=>lbls.push({x:xy(o.lon,o.lat),t:o.n,c:'#6b6f76',pri:2,r:8}));
  placeLabels(lbls);
}
function placeLabels(lbls){
  const placed=lbls.map(l=>({x:l.x[0]-(l.r||6),y:l.x[1]-(l.r||6),w:2*(l.r||6),h:2*(l.r||6)})); const out=[];
  const mctx=placeLabels.ctx||(placeLabels.ctx=document.createElement('canvas').getContext('2d'));
  mctx.font='600 12.5px -apple-system, "PingFang TC", "Noto Sans TC", sans-serif';
  const boxes = lbls.map(l=>({...l,w:mctx.measureText(l.t).width+4,h:15}));
  const pts = lbls.map(l=>({x:l.x[0]-7,y:l.x[1]-7,w:14,h:14}));
  const hit=(b)=>placed.some(p=>!(b.x+b.w<p.x||p.x+p.w<b.x||b.y+b.h<p.y||p.y+p.h<b.y));
  boxes.forEach(b=>{const r=(b.r||8)+3;const [x,y]=b.x;
    const cands=[[x+r,y-7,'start'],[x-r-b.w,y-7,'end'],[x-b.w/2,y-r-15,'middle'],[x-b.w/2,y+r,'middle'],[x+r,y-18,'start'],[x+r,y+4,'start'],[x-r-b.w,y-18,'end'],[x-r-b.w,y+4,'end']];
    for(const [bx,by,anc] of cands){const box={x:bx,y:by,w:b.w,h:b.h};
      if(bx<2||by<2||bx+b.w>W-2||by+b.h>H-2)continue;
      if(!hit(box)){placed.push(box);out.push({...b,bx,by});return;}}
  });
  gL.selectAll('text').data(out).join('text').attr('class',d=>d.pri===0?'cityl':'lbl')
    .attr('x',d=>d.bx+2).attr('y',d=>d.by+11.5).attr('fill',d=>d.c).text(d=>d.t);
}
function tip(ev,html){const t=document.getElementById('tip');if(!ev){t.style.display='none';return;}
  const r=wrap.getBoundingClientRect();t.innerHTML=html;t.style.display='block';
  let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14; if(x>W-270)x-=280; t.style.left=x+'px';t.style.top=y+'px';}

const photoCache = {};
let cardToken = 0;
function esc(t){return String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showCard(o){
  const card=document.getElementById('card'), ph=document.getElementById('cph');
  document.getElementById('ctt').textContent=o.n;
  document.getElementById('cmt').textContent=o.meta||'';
  document.getElementById('cdd').textContent=o.desc||'';
  document.getElementById('cnn').textContent=o.note||'';
  document.getElementById('cnn').style.display=o.note?'block':'none';
  document.getElementById('cdd').style.display=o.desc?'block':'none';
  const q=encodeURIComponent(o.q||o.n);
  let links=`<a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">看更多照片</a>`;
  if(o.wiki) links=`<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(o.wiki)}" target="_blank" rel="noopener">Wikipedia</a>`+links;
  document.getElementById('cll').innerHTML=links;
  card.style.display='block';
  const token=++cardToken;
  if(!o.wiki){ph.innerHTML='這個地點沒有對應的照片，可點「看更多照片」';return;}
  ph.innerHTML='照片載入中…';
  const put=(src)=>{ if(token!==cardToken) return;
    if(!src){ph.innerHTML='這個頁面無法直接載入外部照片，請點下方「看更多照片」';return;}
    const img=new Image(); img.alt=o.n; img.referrerPolicy='no-referrer';
    img.onload=()=>{ if(token===cardToken){ph.innerHTML='';ph.appendChild(img);} };
    img.onerror=()=>{ if(src.big&&src.small){const s2=src.small;src.big=null;img.src=s2;} else if(token===cardToken) ph.innerHTML='照片載入失敗，請點下方「看更多照片」'; };
    img.src=src.big||src.small; };
  if(photoCache[o.wiki]!==undefined){put(photoCache[o.wiki]);return;}
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(o.wiki))
    .then(r=>r.ok?r.json():null)
    .then(j=>{ const t=j&&(j.thumbnail||j.originalimage); let res=null;
      if(t&&t.source){ const big=/\/\d+px-/.test(t.source)?t.source.replace(/\/\d+px-/,'/640px-'):null; res={big:big,small:t.source}; }
      photoCache[o.wiki]=res; put(res); })
    .catch(()=>{ put(null); });
}
function eventCard(e){showCard({n:e.n,meta:`${e.dates}・${e.city}・${e.venue}`,desc:e.how,note:`跟行程的關係　${e.fit}`,wiki:e.wiki,q:e.venue+' '+e.city});}
function hideCard(){document.getElementById('card').style.display='none';cardToken++;}
document.getElementById('cardx').onclick=hideCard;
function stopCard(s,day){showCard({n:s.n,meta:day?`${day.d}（${day.wd}）${day.city}`:'',desc:s.desc,note:s.note,wiki:s.wiki,q:s.n+' '+(day?day.city:'')});}
const zoom = d3.zoom().scaleExtent([0.6,6000]).on('zoom',ev=>{T=ev.transform;base.attr('transform',T);gW.style("display",T.k>6?"none":null);render();scaleBar();});
const sb=svg.append('g');
function scaleBar(){
  const c=proj.invert(T.invert([W/2,H/2])); const mpp=6371000*Math.cos(c[1]*Math.PI/180)/(proj.scale()*T.k);
  const nice=[50,100,200,500,1000,2000,5000,10000,20000,50000,100000,200000];
  let m=nice[0]; for(const n of nice){ if(n/mpp<=130) m=n; }
  const px=m/mpp, x=W-24-px, y=H-22;
  sb.selectAll('*').remove();
  sb.append('rect').attr('x',x-8).attr('y',y-18).attr('width',px+16).attr('height',28).attr('rx',6).attr('fill','rgba(255,255,255,.85)');
  sb.append('path').attr('d',`M${x},${y-4}v6h${px}v-6`).attr('fill','none').attr('stroke','#1f2328').attr('stroke-width',1.5);
  sb.append('text').attr('x',x+px/2).attr('y',y-7).attr('text-anchor','middle').style('font-size','11px').attr('fill','#1f2328')
    .text(m>=1000?(m/1000)+' 公里':m+' 公尺');
}
svg.call(zoom).on('dblclick.zoom',null);
svg.on('click',()=>hideCard());
function zoomToBounds(coords,pad,maxK){
  const p=coords.map(c=>proj(c));const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.min(maxK||6000,(W-2*pad)/Math.max(x1-x0,1),(H-2*pad)/Math.max(y1-y0,1));
  const t=d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(750).call(zoom.transform,t);
}
function zoomAll(){zoomToBounds(allPts,40);}
function zoomToStop(m,minK){const k=Math.max(T.k,1); const p=proj([m.lon,m.lat]);
  const kk=Math.max(k, minK||900); const t=d3.zoomIdentity.translate(W/2,H/2).scale(kk).translate(-p[0],-p[1]);
  svg.transition().duration(650).call(zoom.transform,t);}

// sidebar
const daysEl=document.getElementById('days');
function buildSide(){
  daysEl.innerHTML=''; daysEl.scrollTop=0;
  if(tab==='events'){
    DATA.events.forEach(e=>{const el=document.createElement('div');el.className='ev';
      el.innerHTML=`<div class="en"><span class="badge" style="background:${FIT[e.fit]}">${e.fit}</span>${e.n}</div><div class="em">${e.dates}・${e.city}・${e.venue}</div><div class="eh">${e.how}</div>`;
      el.onclick=()=>{ if(e.lat!==null) zoomToStop(e,250); eventCard(e); };
      daysEl.appendChild(el);});
    return;
  }
  DATA.days.forEach((d,di)=>{
    const el=document.createElement('div');el.className='day'+(sel===di?' sel':'');
    el.innerHTML=`<div class="dh"><span class="dot" style="background:${d.color}"></span><span class="dd">${d.d}（${d.wd}）</span><span class="dc">${d.city}</span></div><div class="dt">${d.title}</div>`;
    if(sel===di){const ol=document.createElement('ol');ol.className='stops';let n=0;
      d.stops.forEach(s=>{if(s.k==='x')return;n++;const li=document.createElement('li');const num=n;
        li.innerHTML=`<span class="num ${s.k}" style="background:${d.color};border-color:${d.color}">${num}</span><span><span class="sn">${s.n}</span>${s.note?`<span class="snote">${s.note}</span>`:''}</span>`;
        li.onclick=(e)=>{e.stopPropagation();zoomToStop(s);stopCard(s,d);};ol.appendChild(li);});
      el.appendChild(ol);}
    el.onclick=()=>selectDay(di,true);
    daysEl.appendChild(el);
  });
}
function selectDay(di,zoomIt){
  hideCard(); sel=di; setTab('days'); document.getElementById('allbtn').classList.remove('on'); buildSide(); render();
  if(zoomIt){const d=DATA.days[di];
    // fit to the day's in-city stops; intercity days fit everything
    let core=d.stops.filter(s=>s.k==='s'||s.k==='i');
    let pts=(core.length>=2?core:d.stops.filter(s=>s.k!=='x')).map(s=>[s.lon,s.lat]);
    zoomToBounds(pts,70);}
  const el=daysEl.children[di]; if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function setTab(t){tab=t;document.getElementById('evbtn').classList.toggle('on',t==='events');document.getElementById('allbtn').classList.toggle('on',t==='days'&&sel===null);}
document.getElementById('allbtn').onclick=()=>{sel=null;setTab('days');buildSide();render();zoomAll();};
document.getElementById('evbtn').onclick=()=>{sel=null;setTab('events');buildSide();render();zoomToBounds(allPts.concat(DATA.events.filter(e=>e.lat!==null).map(e=>[e.lon,e.lat])),40);};
document.getElementById('optchk').onchange=e=>{showOpt=e.target.checked;render();};
document.getElementById('zin').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,2);
document.getElementById('zout').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,.5);
window.addEventListener('resize',()=>{W=wrap.clientWidth;H=wrap.clientHeight;render();scaleBar();});
buildSide(); render(); svg.call(zoom.transform,d3.zoomIdentity);
</script></body></html>
